:root{--bg:#140c2e;--fg:#f4f1ff;--mut:#b9b0e0;--acc:#ff8a5c;--cy:#7fe9ff;--panel:rgba(20,12,46,.74);--line:rgba(244,241,255,.16);color-scheme:dark}

#stage{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(ellipse at 30% 40%,rgba(40,20,80,.45),rgba(14,8,32,.92))}
.ov[hidden]{display:none!important}
.card{display:flex;gap:clamp(16px,4vw,44px);align-items:center;max-width:760px;width:100%;box-sizing:border-box}
.card.solo{max-width:420px;flex-direction:column;text-align:center}
.lead{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px}
.solo .lead{align-items:center}
h1{margin:0;font:italic 700 clamp(34px,11vh,68px)/0.95 "Chakra Petch",system-ui,sans-serif;letter-spacing:.01em}
h1 em{color:var(--acc);font-style:inherit}
.tag{margin:0;color:var(--mut);font-size:clamp(12px,3.4vh,15px);line-height:1.45;max-width:30ch}
.stat{margin:0;font:500 clamp(13px,3.6vh,16px) "Chakra Petch",system-ui,sans-serif;letter-spacing:.06em;color:var(--cy);text-transform:uppercase}
.big{font:700 clamp(40px,14vh,72px)/1 "Chakra Petch",system-ui,sans-serif;color:var(--fg);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{appearance:none;border:0;cursor:pointer;padding:12px 26px;border-radius:999px;background:var(--acc);color:#2a0f2e;font:700 clamp(13px,3.6vh,16px) "Chakra Petch",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.btn:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.keys{flex:1.1 1 0;min-width:0;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:clamp(6px,2.2vh,12px)}
.keys li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;padding:clamp(6px,2vh,10px) 12px;background:var(--panel);border-radius:10px;font-size:clamp(11px,3.1vh,14px);line-height:1.35;color:var(--mut)}
.keys b{font:700 clamp(11px,3vh,13px) "Chakra Petch",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.card.shopc{max-width:900px;flex-direction:column;align-items:stretch;gap:8px;margin:auto}.shopc .lead{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex:none}.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}.up{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}.up p{margin:0;font-size:12.5px;opacity:.85;flex:1}.up .btn{padding:8px 12px;font-size:13px}.pips{color:var(--acc);letter-spacing:2px;font-size:12px}
.card.menu{max-width:860px;align-items:stretch}.card.menu .lead{flex:0 0 38%}.pickc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}.pick{display:flex;flex-direction:column;gap:8px}

.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

.blurb{max-width:none;min-height:2.9em}.blurb b{color:var(--fg)}

.inp:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.btn.sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.link{appearance:none;border:0;background:none;color:var(--acc);font:inherit;text-decoration:underline;cursor:pointer;padding:0 0 0 6px;letter-spacing:inherit;text-transform:inherit}
.status{margin:0;min-height:1.2em;font-size:clamp(11px,3vh,13px);color:var(--cy);max-width:46ch}
.status.err{color:#ffb27a}
.rooms{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;max-height:min(70vh,420px)}

.rm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--panel);border-radius:10px}
.rm div{min-width:0}.rm b{display:block;font:700 14px "Chakra Petch",system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.plist li{display:grid;grid-template-columns:12px 1fr;column-gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-radius:10px;font:600 14px Sora,system-ui,sans-serif}
.plist li small{grid-column:2;display:inline}
.plist i{width:12px;height:12px;border-radius:50%;grid-row:span 2}
.empty{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.ov{overflow:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#rot{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);text-align:center;padding:24px}
#rot p{margin:0;font:700 22px "Chakra Petch",system-ui,sans-serif;letter-spacing:.04em}
#rot small{display:block;margin-top:6px;font:400 14px Sora,system-ui,sans-serif;color:var(--mut)}
.ph{width:58px;height:96px;border:4px solid var(--fg);border-radius:12px;position:relative;animation:turn 2.4s ease-in-out infinite}
.ph::after{content:"";position:absolute;left:50%;bottom:7px;width:16px;height:4px;margin-left:-8px;border-radius:2px;background:var(--acc)}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.ph{animation:none;transform:rotate(-90deg)}}
@media (max-height:400px){.card{gap:18px}.keys li{grid-template-columns:64px 1fr}}
</style>
</head>

function groundTopAt(x){
  let prev=null,next=null;
  for(const s of solids){if(s.type==='arch'||s.gone)continue;
    if(x>=s.x&&x<=s.x+s.w)return s.y;
    if(s.x+s.w<x&&(!prev||s.x>prev.x))prev=s;
    if(s.x>x&&(!next||s.x<next.x))next=s}
  if(prev&&next){const a=prev.x+prev.w,t=(x-a)/(next.x-a);return lerp(prev.y,next.y,t)-Math.sin(t*Math.PI)*70}
  return prev?prev.y:next?next.y:500;
}

const touches=new Map(),keys=new Set();
const inp={sx:0,sy:0,jumpBuf:0,dashBuf:0,rollBuf:0,jumpTouch:0};

function geo(){const r=clamp(H*.14,34,54);return{r,jump:{x:W-r-22,y:H-r-22},dash:{x:W-r*3-40,y:H-r-22},roll:{x:W-r*3-40,y:H-r*3-34},pause:{x:W-26,y:26,r:18}}}
function hitRole(x,y,type){
  const g=geo(),d=(p,rr)=>Math.hypot(x-p.x,y-p.y)<rr;
  if(d(g.pause,30))return'pause';
  if(d(g.jump,g.r+16))return'jump';
  if(d(g.dash,g.r+16))return'dash';
  if(d(g.roll,g.r+12))return'roll';
  if(type==='mouse')return'hook';
  return x<W*.4?'stick':'hook';
}
let onPause=()=>{},onHook=()=>{},onRelease=()=>{},isPlaying=()=>false;
function press(role,x,y,id){
  if(role==='jump'){pressed.jump=true;inp.jumpTouch++;inp.jumpBuf=.16}
  else if(role==='dash'){pressed.dash=true;inp.dashBuf=.18}
  else if(role==='roll'){inp.rollBuf=.3}
  else if(role==='stick'){if(stick.id<0){stick.on=true;stick.ox=x;stick.oy=y;stick.x=0;stick.y=0;stick.id=id}}
  else if(role==='hook'){for(const[k,t]of touches)if(t.role==='hook'&&k!==id)t.role='none';onHook(x,y)}
  else if(role==='pause')onPause();
}
function lift(t,id){
  if(t.role==='jump'){inp.jumpTouch=Math.max(0,inp.jumpTouch-1)}
  else if(t.role==='dash'){pressed.dash=false}
  else if(t.role==='stick'&&stick.id===id){stick.on=false;stick.x=0;stick.y=0;stick.id=-1}
  else if(t.role==='hook')onRelease();
}
cv.addEventListener('pointerdown',e=>{
  if(!isPlaying())return;e.preventDefault();audio();

});

  const t=touches.get(e.pointerId);if(!t)return;e.preventDefault();
  const r=cv.getBoundingClientRect();t.x=e.clientX-r.left;t.y=e.clientY-r.top;

/* the cat runs, leaps gaps in an arc, and scrambles up cliff faces */
function catSolid(x){for(const s of solids){if(s.type==='arch'||s.gone)continue;if(x>=s.x&&x<=s.x+s.w)return s}return null}
function catLeap(sp){

  const g=1900;if(!ns){cat.mode='leap';cat.vy=-300;cat.lvx=sp;return}

function catMove(dt,mult){

    const w=catSolid(cat.x+22);if(w&&cat.y>w.y+28&&cat.y<w.y+420&&cat.x+22<w.x+w.w*.5){cat.mode='climb';cat.cx=w.x-12;cat.ct=w.y;cat.x=cat.cx;return}
    const s=catSolid(cat.x);if(s&&cat.vy>0&&cat.y>=s.y){cat.y=s.y;cat.mode='run';cat.vy=0;burst(cat.x-30,cat.y,6,'#e8dccb',100,.35,200)}
    else if(cat.y>WATER_Y+40){cat.mode='run';cat.x=Math.max(cat.x,P.x-900);cat.y=groundTopAt(cat.x)}
    return}

  if(a==='shop')return showShop();

  if(a==='buy'){const k=b.dataset.k,u=UPG[k],lv=UP[k];if(u&&lv<u.max&&bank>=u.cost[lv]){bank-=u.cost[lv];UP[k]++;saveBank();sfx.gem&&sfx.gem()}return showShop(u?'Upgraded '+u.n+'!':'')}

});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!NET.active)onPause()});

/* ---------- loop ---------- */
let lastT=performance.now(),slow=.016,slowN=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000)||0;lastT=now;
  /* keep it smooth: if frames stay slow, draw at a lower resolution (2 -> 1.5 -> 1). It never goes back up, so it can't flip-flop */
  if(state==='play'&&dt>0){slow=slow*.97+dt*.03;if(++slowN>150&&slow>.0235&&DPRMAX>1){DPRMAX=DPRMAX>1.5?1.5:1;slowN=0;slow=.016;resize()}}
  try{
    if(state==='play'){
      if(countdown>0){countdown-=dt;time+=dt;if(countdown<=0)sfx.jump()}
      else{const n=Math.ceil(dt/(1/90));for(let i=0;i<n;i++)update(dt/n)}
    }else{time+=dt;if(state==='menu'){cam.x+=60*dt;cam.y=lerp(cam.y,300,dt);genUntil(cam.x+3000);P.x=-9999}}
    ghostTick(dt);netTick(dt);draw();
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}

/* every menu page is scaled to fit the screen, so nothing scrolls out of frame */
function fitOv(){
  const c=ov.firstElementChild;if(!c||ov.hidden)return;c.style.zoom=1;
  const cs=getComputedStyle(ov),aw=ov.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=ov.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const r=c.getBoundingClientRect(),z=Math.min(1,aw/Math.max(1,c.scrollWidth),ah/Math.max(1,r.height));c.style.zoom=z<1?Math.max(.5,z*.99):1;
}
let fitQ=0;new MutationObserver(()=>{cancelAnimationFrame(fitQ);fitQ=requestAnimationFrame(fitOv)}).observe(ov,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
addEventListener('resize',()=>requestAnimationFrame(fitOv));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(fitOv));

/* =========================================================== multiplayer (ported from Riptide Rally)
   One player hosts a room; everyone talks to the host through a free public MQTT relay over secure websockets,
   so it works on any phone network or Wi-Fi with no game server to run. Every player runs the same world
   (the host shares the journey and a seed), simulates their own mouse and their own cat, and shares their
   position about 12 times a second. First mouse into the safe hole wins the run. */
const NET={active:false,isHost:false,mq:null,listers:null,conns:new Map(),hostConn:null,code:'',myId:'',players:[],racing:false,seen:new Map(),hbTimer:0,hostSeen:0,
  lobby:{map:0},results:[],runStart:0,sendT:0,lastStart:null,round:0,status:'',err:false};
const qs=new URLSearchParams(location.search);
const RELAYS=qs.get('mqtt')?qs.get('mqtt').split(',').map((url,i)=>({url})):[
  {url:'wss://broker.hivemq.com:8884/mqtt'},
  {url:'wss://broker.emqx.io:8084/mqtt'},
  {url:'wss://test.mosquitto.org:8081/mqtt'},
  {url:'wss://public.cloud.shiftr.io',username:'public',password:'public'},
];
const TOPIC='ninja-mouse/v1';
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:5},()=>CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]).join('');
const newId=()=>'p'+Math.random().toString(36).slice(2,10);
const PUBLIC_URL='https://zayaiken21.github.io/NinjaMouse/';
const inviteLink=code=>{
  const here=location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,''),q='join.html?r='+code+'&b='+(NET.relay|0);
  if(/^https?:$/.test(location.protocol)&&/github\.io$/.test(location.hostname))return here+q;
  return PUBLIC_URL+q;
};
function loadMqttLib(){return new Promise((res,rej)=>{if(window.mqtt)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js';
  s.onload=()=>window.mqtt?res():rej(new Error('lib'));s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)})}
async function openRelayAt(i,will){
  await loadMqttLib();const R=RELAYS[i];
  return await new Promise((res,rej)=>{
    const cl=window.mqtt.connect(R.url,{clientId:'nm_'+Math.random().toString(36).slice(2,12),clean:true,keepalive:15,reconnectPeriod:2000,connectTimeout:7000,will,protocolVersion:4,username:R.username,password:R.password});
    const to=setTimeout(()=>{cl.end(true);rej(new Error('timeout'))},8000);
    cl.once('connect',()=>{clearTimeout(to);cl.relay=i;res(cl)});
    cl.once('error',e=>{clearTimeout(to);cl.end(true);rej(e)});
  });
}
function openAllRelays(willFor,onLate){
  return new Promise((res,rej)=>{const got=[];let done=false,fails=0;
    RELAYS.forEach((_,i)=>openRelayAt(i,willFor?willFor(i):undefined).then(c=>{
      if(done){if(onLate)onLate(c);else c.end(true);return}
      got.push(c);if(got.length===1)setTimeout(()=>{done=true;res(got.slice())},1200);
    }).catch(()=>{if(++fails===RELAYS.length&&!got.length){done=true;rej(new Error('offline'))}}));
  });
}
const pub=(c,topic,obj,opts={qos:0})=>{try{if(c&&c.connected)c.publish(topic,typeof obj==='string'?obj:JSON.stringify(obj),opts)}catch(e){}};
const parse=buf=>{try{const s=buf.toString();return s?JSON.parse(s):null}catch(e){return null}};
const OFFLINE_MSG="Couldn't reach the multiplayer server. Check your connection and try again. Online play needs the game opened from its GitHub Pages link.";
function cleanName(v){return String(v||'').replace(/[^A-Za-z0-9 _.\-]/g,'').replace(/\s+/g,' ').trim().slice(0,16)}
let myName='';try{myName=cleanName(localStorage.getItem('ninjamouse-name')||'')}catch(_){}
const DEV_ID=(()=>{let d='';try{d=localStorage.getItem('ninjamouse-dev')||''}catch(_){}if(!/^d[a-z0-9]{4,12}$/.test(d)){d='d'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('ninjamouse-dev',d)}catch(_){}}return d})();

/* ---------- screens ---------- */
let mpStep='name';
function mpStatus(msg,err){NET.status=msg||'';NET.err=!!err;const el=$('mpStatus');if(el){el.textContent=NET.status;el.classList.toggle('err',NET.err)}}
const statusP=()=>`<p id="mpStatus" class="status${NET.err?' err':''}" role="status">${escH(NET.status)}</p>`;
function showMp(step){
  mpStep=step;if(state==='play'||state==='pause'||state==='mpres'){startMap(pickMap)}state='menu';ov.hidden=false;
  if(step==='choose')startBrowse();else stopBrowse();
  if(step==='name')ov.innerHTML=`<div class="card solo"><div class="lead"><p class="stat">Multiplayer</p><h1>Pick a<br><em>name</em></h1>
    <p class="tag">Other players see it over your mouse. 2 to 16 letters or numbers.</p>
    <div class="row"><input id="nameIn" class="inp" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your name" value="${escH(myName)}"><button class="btn" data-act="name-go">Next</button></div>
    ${statusP()}<div class="row"><button class="btn ghost" data-act="mp-back">Back</button></div></div></div>`;
  else if(step==='choose')ov.innerHTML=`<div class="card"><div class="lead"><p class="stat">Multiplayer · ${escH(myName)} <button class="link" data-act="rename">Change</button></p><h1>Run with<br><em>friends</em></h1>
    <p class="tag">Everyone runs the same journey with their own cat on their tail. First mouse into the safe hole wins.</p>
    <div class="row"><button class="btn" data-act="host">Host a run</button><button class="btn ghost" data-act="quick">Quick match</button></div>
    <div class="row"><input id="codeIn" class="inp sm" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Room code"><button class="btn ghost" data-act="join-code">Join</button></div>
    ${statusP()}<div class="row"><button class="btn ghost" data-act="mp-back">Back</button></div></div>
    <div class="rooms"><p class="stat">Open runs <span id="roomScan">Searching…</span></p><div id="roomList" class="rlist"></div></div></div>`;
  else if(step==='lobby')renderLobby();
  if(step==='choose')renderRooms();
}
function renderLobby(){
  if(mpStep!=='lobby'||state!=='menu'||!NET.active)return;
  const host=NET.players[0],L=NET.lobby,m=MAPS[L.map|0]||MAPS[0];
  const plist=NET.players.map((p,i)=>`<li><i style="background:${GHOST_COLS[i%8]}"></i>${escH(p.name)}${i===0?' <small>host</small>':''}${p.id===NET.myId?' <small>you</small>':''}${p.away?' <small>away</small>':''}</li>`).join('');
  ov.hidden=false;ov.innerHTML=`<div class="card"><div class="lead"><p class="stat">Room ${escH(NET.code)} · ${NET.players.length}/8 mice</p><h1>${NET.isHost?'Your<br><em>room</em>':escH(host?host.name:'Host')+"'s<br><em>room</em>"}</h1>
    ${NET.isHost?`<p class="stat">Journey</p>${mapsHTML(L.map|0)}<div class="row"><button class="btn" data-act="start">Start run</button><button class="btn ghost" data-act="invite">Invite</button></div>`
      :`<p class="tag">Journey: ${m.name}. ${NET.racing?'A run is on. You will jump in now.':'Waiting for the host to start.'}</p><div class="row"><button class="btn ghost" data-act="invite">Invite</button></div>`}
    ${statusP()}<div class="row"><button class="btn ghost" data-act="leave">Leave room</button></div></div>
    <div class="rooms"><p class="stat">Mice in this room</p><ul class="plist">${plist}</ul></div></div>`;
}
function showMpResults(){
  if(state!=='mpres')return;ov.hidden=false;
  const rows=NET.results.slice().sort((a,b)=>a.time-b.time).map((r,i)=>`<li><i style="background:${colorOf(r.o)}"></i>${i+1}. ${escH(nameOf(r.o))}<small>${r.time.toFixed(1)}s · ${r.ch} cheese</small></li>`).join('');
  const left=NET.players.length-NET.results.length;
  ov.innerHTML=`<div class="card"><div class="lead"><p class="stat">${map.name} · Run ${NET.round}</p><p class="big">${NET.results[0]&&NET.results[0].o===NET.myId?'You won!':'Safe!'}</p>
    <p class="tag">${left>0?left+' still running from their cats.':'Everyone made it.'}</p>
    <div class="row">${NET.isHost?'<button class="btn" data-act="next-run">Next run</button><button class="btn ghost" data-act="to-lobby">Lobby</button>':''}<button class="btn ghost" data-act="leave">Leave room</button></div>${NET.isHost?'':'<p class="tag">The host starts the next run.</p>'}</div>
    <div class="rooms"><p class="stat">Finish order</p><ul class="plist">${rows}</ul></div></div>`;
}
const idxOf=id=>Math.max(0,NET.players.findIndex(p=>p.id===id));
const colorOf=id=>GHOST_COLS[idxOf(id)%8];
const nameOf=id=>{const p=NET.players.find(p=>p.id===id);return p?p.name:'Mouse'};

const OFFLINE_NOW="You're offline right now. Solo runs work anywhere; multiplayer needs a connection.";
const isOff=()=>navigator.onLine===false;
function mpAction(a,b){
  if(isOff()&&['host','quick','join','join-code'].includes(a)){mpStatus(OFFLINE_NOW,true);return}
  if(a==='mp'){showMp(NET.active?'lobby':(myName.length>=2?'choose':'name'));return}
  if(a==='mp-back'){stopBrowse();showMenu();return}
  if(a==='rename'){showMp('name');return}
  if(a==='name-go'){const n=cleanName($('nameIn').value);if(n.length<2){mpStatus('Pick a name of 2 to 16 letters or numbers.',true);return}
    myName=n;try{localStorage.setItem('ninjamouse-name',n)}catch(_){}mpStatus('');
    if(pendingJoin){const c=pendingJoin;pendingJoin=null;showMp('choose');joinRoom(c,inviteRelay);return}showMp('choose');return}
  if(a==='host'){hostRoom(b);return}
  if(a==='quick'){const now=Date.now(),open=[...BROWSE.rooms.values()].filter(r=>r.n<r.max&&now-r.seen<12000);
    if(open.length){const r=open[Math.floor(Math.random()*open.length)];joinRoom(r.code,r.b)}else{mpStatus('No open runs right now, so we opened one for you.');hostRoom(b)}return}
  if(a==='join-code'){const c=String($('codeIn').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4){mpStatus('Type the 5-letter room code your friend sent.',true);return}joinRoom(c,null);return}
  if(a==='join'){joinRoom(b.dataset.code,+b.dataset.b);return}
  if(a==='leave'){leaveRoom();ghosts.clear();showMp('choose');mpStatus('You left the room.');return}
  if(a==='invite'){invite();return}
  if(a==='start'||a==='next-run'){if(!NET.isHost)return;if(a==='next-run')NET.lobby.map=((NET.lobby.map|0)+1)%MAPS.length;startRun();return}
  if(a==='to-lobby'){if(!NET.isHost)return;NET.racing=false;ghosts.clear();broadcastLobby();showMp('lobby');return}
}
ov.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='nameIn')mpAction('name-go');if(e.target.id==='codeIn')mpAction('join-code')});
async function invite(){
  const link=inviteLink(NET.code),msg=`Run from the cat with me in Ninja Mouse! Room ${NET.code}.`;
  if(navigator.share&&coarse){sayAway(true);try{await navigator.share({title:'Join my run on Ninja Mouse',text:msg,url:link});mpStatus('Invite sent.');return}catch(e){if(e&&e.name==='AbortError')return}finally{if(document.visibilityState==='visible')sayAway(false)}}
  try{await navigator.clipboard.writeText(msg+' '+link);mpStatus('Invite link copied. Paste it in a text or chat.')}catch(e){mpStatus('Invite link: '+link)}
}

/* ---------- hosting ---------- */
const roomTopic=code=>`${TOPIC}/rooms/${code}`,rTopic=(code,k)=>`${TOPIC}/r/${code}/${k}`;
function roomInfo(){const host=NET.players[0];return{code:NET.code,b:NET.relay,name:(host?host.name:'Mouse')+"'s run",n:NET.players.length,max:8,track:(MAPS[NET.lobby.map|0]||MAPS[0]).name,racing:!!NET.racing,at:Date.now()}}
const publishRoom=()=>{if(!NET.isHost||!NET.listers)return;const info=roomInfo();for(const c of NET.listers)pub(c,roomTopic(NET.code),info,{qos:1,retain:true})};
function hostConnFor(id){let c=NET.conns.get(id);if(!c){c={peer:id,send:d=>pub(NET.mq,rTopic(NET.code,'c/'+id),{d})};NET.conns.set(id,c)}return c}
let hosting=false;
async function hostRoom(btn){
  if(hosting||NET.active)return;hosting=true;if(btn)btn.disabled=true;mpStatus('Opening a room…');
  try{
    stopBrowse();const code=newCode(),myId=newId();
    const listers=await openAllRelays(()=>({topic:roomTopic(code),payload:'',qos:1,retain:true}),c=>{
      if(NET.listers!==listers){c.end(true);return}listers.push(c);c.on('connect',()=>{if(NET.listers===listers)publishRoom()});publishRoom()});
    const mq=listers.slice().sort((x,y)=>x.relay-y.relay)[0];
    Object.assign(NET,{mq,listers,relay:mq.relay,code,active:true,isHost:true,myId,racing:false,conns:new Map(),seen:new Map(),results:[],round:0});
    for(const c of listers.slice())c.on('connect',()=>{if(NET.listers===listers)publishRoom()});
    NET.lobby={map:pickMap};NET.players=[{id:myId,name:myName||'Mouse'}];
    mq.subscribe(rTopic(code,'h'),{qos:0});
    mq.on('message',(topic,buf)=>{if(mq!==NET.mq)return;const m=parse(buf);if(!m||!m.f||!m.d)return;NET.seen.set(m.f,performance.now());if(m.d.t==='hello'||NET.conns.has(m.f))hostRecv(hostConnFor(m.f),m.d)});
    mq.on('connect',()=>{if(mq===NET.mq){publishRoom();broadcastLobby()}});
    publishRoom();startHeartbeat();
    mpStatus('Room open. It shows up in everyone\'s list, or send the invite.');showMp('lobby');
  }catch(e){mpStatus(OFFLINE_MSG,true);if(mpStep==='choose')startBrowse()}
  hosting=false;if(btn)btn.disabled=false;
}
function startRun(){
  const seed=(Math.random()*1e9)|0;NET.round++;
  const msg={t:'start',map:NET.lobby.map|0,seed,lead:3,round:NET.round};
  NET.lastStart=msg;NET.racing=true;relay(msg);publishRoom();beginRun(msg);
}
function beginRun(msg){
  ghosts.clear();NET.results=[];NET.round=msg.round|0;NET.racing=true;stopBrowse();
  pickMap=msg.map|0;play(msg.map|0,msg.seed|0);countdown=msg.lead||0;NET.runStart=performance.now()+countdown*1000;NET.seed=msg.seed|0;
}

/* ---------- joining ---------- */
let pendingJoin=null,joining=false,inviteRelay=null;
async function joinRoom(code,relayHint){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(joining||NET.active||!code)return;
  const info=BROWSE.rooms.get(code);joining=true;stopBrowse();
  mpStatus('Joining '+(info?info.name:'room '+code)+'…');
  const myId=newId();let mq=null;
  try{
    let listing=info||null;
    if(!listing){const cs=await openAllRelays();
      listing=await new Promise(res=>{const to=setTimeout(()=>res(null),5000);
        for(const c of cs){c.on('message',(t,buf)=>{const l=parse(buf);if(t===roomTopic(code)&&l&&Date.now()-(+l.at||0)<45000){clearTimeout(to);res(l)}});c.subscribe(roomTopic(code))}});
      for(const c of cs){try{c.end(true)}catch(e){}}}
    if(!listing)throw new Error('notfound');
    const ri=Number.isInteger(+listing.b)&&RELAYS[+listing.b]?+listing.b:Number.isInteger(+relayHint)&&RELAYS[+relayHint]?+relayHint:0;
    mq=await openRelayAt(ri,{topic:rTopic(code,'h'),payload:JSON.stringify({f:myId,d:{t:'bye'}}),qos:0,retain:false});
    if(listing.n>=8)throw new Error('full');
    Object.assign(NET,{mq,code,relay:ri,active:true,isHost:false,myId,racing:false,hostSeen:performance.now(),hostAway:false,gotLobby:false,results:[]});
    NET.hostConn={send:d=>pub(mq,rTopic(code,'h'),{f:myId,d})};
    mq.subscribe([rTopic(code,'a'),rTopic(code,'c/'+myId)],{qos:0});
    mq.on('message',(topic,buf)=>{if(mq!==NET.mq)return;const m=parse(buf);if(!m||!m.d||m.x===myId)return;NET.hostSeen=performance.now();clientRecv(m.d)});
    const hello=()=>NET.hostConn.send({t:'hello',dev:DEV_ID,name:myName});
    let first=true;mq.on('connect',()=>{if(first){first=false;return}if(mq===NET.mq)hello()});
    hello();
    await new Promise((res,rej)=>{let n=0;const iv=setInterval(()=>{if(NET.gotLobby){clearInterval(iv);res()}else if(!NET.active){clearInterval(iv);rej(new Error('full'))}else if(++n>16){clearInterval(iv);rej(new Error('nohost'))}else if(n%4===0)hello()},500)});
    startHeartbeat();
    if(state==='menu'){mpStatus('Joined. Waiting for the host to start.');showMp('lobby')}
  }catch(e){
    const msg=e.message==='notfound'?`Room ${code} isn't open any more. Pick a run from the list, or ask your friend for a fresh invite.`
      :e.message==='full'?'That room is full (8 mice).':e.message==='nohost'?'That room has closed. Pick another run or host your own.':OFFLINE_MSG;
    if(e.message==='nohost'){BROWSE.rooms.delete(code)}
    if(NET.mq===mq&&NET.active){NET.active=false;NET.mq=null}
    try{mq&&mq.end(true)}catch(_){}
    showMp('choose');mpStatus(msg,true);
  }
  joining=false;
}

/* ---------- open rooms list ---------- */
const BROWSE={cs:[],on:false,starting:false,timer:0,rooms:new Map()};
async function startBrowse(){
  if(BROWSE.on||BROWSE.starting||NET.active)return;
  if(isOff()){const sc=$('roomScan');if(sc)sc.textContent='· offline';const el=$('roomList');if(el)el.innerHTML='<p class="empty">'+OFFLINE_NOW+'</p>';return}
  BROWSE.starting=true;renderRooms();
  try{
    const watch=c=>{c.on('message',(topic,buf)=>{
      const code=topic.split('/').pop(),i=parse(buf),cur=BROWSE.rooms.get(code);
      if(!i){if(cur){cur.from.delete(c.relay);if(!cur.from.size)BROWSE.rooms.delete(code)}renderRooms();return}
      if(Date.now()-(+i.at||0)>45000){try{c.publish(topic,'',{qos:1,retain:true})}catch(e){}if(cur){BROWSE.rooms.delete(code);renderRooms()}return}
      const r={code,b:+i.b||0,name:String(i.name||'Run').slice(0,40),n:i.n|0,max:i.max|0||8,track:String(i.track||'').slice(0,40),racing:!!i.racing,at:+i.at||Date.now(),from:cur?cur.from:new Set()};
      r.from.add(c.relay);r.seen=Math.min(Date.now(),r.at+2000);
      if(!cur||r.at>=cur.at)BROWSE.rooms.set(code,r);else cur.from.add(c.relay);renderRooms()});
      c.subscribe(`${TOPIC}/rooms/+`,{qos:1})};
    const cs=await openAllRelays(undefined,c=>{if(BROWSE.on&&BROWSE.cs===cs){cs.push(c);watch(c);renderRooms()}else c.end(true)});
    if(!BROWSE.starting){cs.forEach(c=>c.end(true));return}
    BROWSE.cs=cs;BROWSE.on=true;BROWSE.rooms.clear();cs.forEach(watch);BROWSE.timer=setInterval(renderRooms,2000);
  }catch(e){const el=$('roomScan');if(el)el.textContent='Offline';mpStatus(OFFLINE_MSG,true)}
  BROWSE.starting=false;renderRooms();
}
function stopBrowse(){BROWSE.starting=false;if(!BROWSE.on)return;clearInterval(BROWSE.timer);BROWSE.on=false;BROWSE.rooms.clear();const cs=BROWSE.cs;BROWSE.cs=[];cs.forEach(c=>{try{c.end(true)}catch(e){}})}
function renderRooms(){
  const el=$('roomList');if(!el)return;const now=Date.now();
  for(const[k,r]of BROWSE.rooms)if(now-r.seen>15000||r.n<1)BROWSE.rooms.delete(k);
  const rooms=[...BROWSE.rooms.values()].sort((a,b)=>(a.racing-b.racing)||(b.n-a.n));
  const sc=$('roomScan');if(sc)sc.textContent=isOff()?'· offline':BROWSE.on?`· ${rooms.length} open`:'· searching…';
  if(!rooms.length){el.innerHTML=`<p class="empty">${isOff()?OFFLINE_NOW:BROWSE.on?'No runs open right now. Host one and it shows up here for everyone.':'Looking for open runs…'}</p>`;return}
  el.innerHTML=rooms.map(r=>{const full=r.n>=r.max;return`<div class="rm"><div><b>${escH(r.name)}</b><small>${r.n}/${r.max} mice · ${escH(r.track)}${r.racing?' · running':''} · ${escH(r.code)}</small></div>
    <button class="btn sm" data-act="join" data-code="${escH(r.code)}" data-b="${r.b}" ${full?'disabled':''}>${full?'Full':'Join'}</button></div>`}).join('');
}
function checkInvite(){
  const m=/^#join-([A-Za-z0-9]{3,8})(?:-(\d))?$/.exec(location.hash);if(!m)return;
  const code=m[1].toUpperCase();inviteRelay=m[2]!=null?+m[2]:null;
  try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}
  if(myName.length>=2){showMp('choose');joinRoom(code,inviteRelay)}else{pendingJoin=code;showMp('name');mpStatus('Pick a name, then you will join the run.')}
}

/* ---------- leaving, heartbeats, stepping away ---------- */
function leaveRoom(now=false){
  if(!NET.active)return;const mq=NET.mq,code=NET.code,listers=NET.listers||[];
  if(NET.isHost){relay({t:'closed'});for(const c of listers)pub(c,roomTopic(code),'',{qos:1,retain:true})}
  else{try{NET.hostConn&&NET.hostConn.send({t:'bye'})}catch(e){}}
  clearInterval(NET.hbTimer);
  Object.assign(NET,{active:false,isHost:false,mq:null,listers:null,hostConn:null,conns:new Map(),players:[],racing:false,myId:'',seen:new Map(),results:[]});
  const end=()=>{for(const c of new Set([mq,...listers])){try{c&&c.end(false)}catch(e){}}};
  if(now)end();else setTimeout(end,300);
}
const AWAY_GRACE=600000,QUIET_DROP=20000;
function startHeartbeat(){
  clearInterval(NET.hbTimer);NET.seen=NET.seen||new Map();NET.hostSeen=performance.now();let tick=0;
  NET.hbTimer=setInterval(()=>{
    if(!NET.active)return clearInterval(NET.hbTimer);const now=performance.now();tick++;
    if(NET.isHost){relay({t:'hb'});if(tick%2===0)publishRoom();
      for(const id of[...NET.conns.keys()]){const p=NET.players.find(x=>x.id===id),limit=p&&p.away?AWAY_GRACE:QUIET_DROP;if(now-(NET.seen.get(id)||now)>limit)peerLeft(id)}}
    else{try{NET.hostConn.send({t:'hb'})}catch(e){}if(now-NET.hostSeen>(NET.hostAway?AWAY_GRACE:QUIET_DROP))hostGone('Lost the connection to the host.')}
  },2000);
}
function sayAway(away){
  if(!NET.active)return;const msg={t:away?'away':'back'};
  if(NET.isHost){relay(msg);if(!away){publishRoom();broadcastLobby()}}else{try{NET.hostConn.send(msg)}catch(e){}}
  if(!away){const now=performance.now();NET.hostSeen=now;if(NET.seen)for(const k of NET.seen.keys())NET.seen.set(k,now)}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){sayAway(true);return}
  for(const c of[NET.mq,...(NET.listers||[]),...BROWSE.cs])if(c&&!c.connected){try{c.reconnect()}catch(e){}}
  sayAway(false);
});
addEventListener('pagehide',()=>{leaveRoom(true);stopBrowse()});
addEventListener('online',()=>{if(mpStep==='choose'&&state==='menu'&&!ov.hidden&&$('roomList')){mpStatus('');startBrowse()}});
addEventListener('offline',()=>{if(NET.active)toast('Lost service. Your run keeps going.','#ffb27a')});
function hostGone(why){if(!NET.active||NET.isHost)return;leaveRoom();ghosts.clear();showMp('choose');mpStatus(typeof why==='string'?why:'The host closed the room.',true)}
function relay(d,except){if(NET.isHost&&NET.mq)pub(NET.mq,rTopic(NET.code,'a'),except?{x:except,d}:{d})}
function netSend(d){if(!NET.active)return;if(NET.isHost)relay(d,null);else if(NET.hostConn){try{NET.hostConn.send(d)}catch(e){}}}
function broadcastLobby(){if(NET.isHost){relay({t:'lobby',players:NET.players,lobby:NET.lobby,racing:NET.racing});publishRoom()}renderLobby()}
function hostRecv(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'){
    if(NET.players.length>=8&&!NET.players.some(p=>p.id===conn.peer)){conn.send({t:'full',why:'That room is full (8 mice).'});NET.conns.delete(conn.peer);return}
    const dev=/^d[a-z0-9]{4,12}$/.test(d.dev||'')?d.dev:'';
    if(dev)for(const old of NET.players.filter(p=>p.dev===dev&&p.id!==conn.peer&&p.id!==NET.myId))peerLeft(old.id);
    let name=cleanName(d.name)||'Mouse';const taken=new Set(NET.players.filter(p=>p.id!==conn.peer).map(p=>p.name));
    for(let n=2;taken.has(name);n++)name=cleanName(d.name).slice(0,13)+' '+n;
    const was=NET.players.some(p=>p.id===conn.peer);
    NET.players=NET.players.filter(p=>p.id!==conn.peer).concat({id:conn.peer,dev,name});
    broadcastLobby();if(!was)toast(name+' joined','#7fe9ff');
    if(NET.racing&&NET.lastStart&&!was)conn.send({...NET.lastStart,lead:3});   // joined mid-run: start them on the same journey
    return;
  }
  if(d.t==='bye'){peerLeft(conn.peer);return}
  if(d.t==='hb')return;
  if(d.t==='away'||d.t==='back'){const p=NET.players.find(x=>x.id===conn.peer);if(p){p.away=d.t==='away';broadcastLobby()}return}
  if(d.o!==conn.peer)return;   // players only speak for themselves
  relay(d,conn.peer);handleGame(d);
}
function peerLeft(id){
  if(!NET.isHost)return;const p=NET.players.find(x=>x.id===id);if(!p){NET.conns.delete(id);return}
  NET.players=NET.players.filter(x=>x.id!==id);NET.conns.delete(id);if(NET.seen)NET.seen.delete(id);
  relay({t:'left',o:id});handleGame({t:'left',o:id});broadcastLobby();toast(p.name+' left','#ffb27a');
}
function clientRecv(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='lobby'){NET.gotLobby=true;NET.players=Array.isArray(d.players)?d.players:[];NET.lobby=d.lobby||{map:0};const was=NET.racing;NET.racing=!!d.racing;
    if(was&&!NET.racing&&(state==='play'||state==='pause'||state==='mpres')){ghosts.clear();showMp('lobby')}else renderLobby();if(state==='mpres')showMpResults();return}
  if(d.t==='full'){leaveRoom();showMp('choose');mpStatus(d.why,true);return}
  if(d.t==='hb')return;
  if(d.t==='closed'){hostGone('The host closed the room.');return}
  if(d.t==='away'){NET.hostAway=true;return}
  if(d.t==='back'){NET.hostAway=false;NET.hostSeen=performance.now();return}
  if(d.t==='start'){beginRun(d);return}
  handleGame(d);
}
function handleGame(d){
  if(d.t==='st'){let g=ghosts.get(d.o);const now=performance.now();
    if(!g){g={x:d.x,y:d.y};ghosts.set(d.o,g)}
    Object.assign(g,{tx:+d.x||0,ty:+d.y||0,vx:+d.vx||0,vy:+d.vy||0,f:d.f<0?-1:1,gr:!!d.gr,g:!!d.g,h:Array.isArray(d.h)?d.h:null,a:+d.a||0,d:!!d.d,r:!!d.r,at:now,name:nameOf(d.o),col:colorOf(d.o)});
    if(Math.abs(g.x-g.tx)>600){g.x=g.tx;g.y=g.ty}return}
  if(d.t==='fin'){if(!NET.results.some(r=>r.o===d.o)){NET.results.push({o:d.o,time:+d.time||0,ch:d.ch|0});if(d.o!==NET.myId)toast(nameOf(d.o)+' reached the safe hole','#ffd58a')}showMpResults();return}
  if(d.t==='cg'){if(d.o!==NET.myId)toast(nameOf(d.o)+' got caught by their cat','#ffb27a');return}
  if(d.t==='left'){ghosts.delete(d.o);NET.results=NET.results.filter(r=>r.o!==d.o);showMpResults();return}
}
function ghostTick(dt){
  const now=performance.now();
  for(const[id,g]of ghosts){if(now-g.at>5000||id===NET.myId){ghosts.delete(id);continue}
    const age=Math.min(.25,(now-g.at)/1000),k=1-Math.exp(-14*dt);g.x=lerp(g.x,g.tx+g.vx*age,k);g.y=lerp(g.y,g.ty+g.vy*age,k);g.a+=dt*(g.gr?Math.abs(g.vx)/42:3)}
}
function netTick(dt){
  if(!NET.active||!NET.racing||state!=='play'||countdown>0)return;
  NET.sendT-=dt;if(NET.sendT>0)return;NET.sendT=1/12;
  const h=P.hook&&P.hook.mode==='on'?[Math.round(P.hook.tx),Math.round(P.hook.ty)]:0;
  netSend({t:'st',o:NET.myId,x:Math.round(P.x),y:Math.round(P.y),vx:Math.round(P.vx),vy:Math.round(P.vy),f:P.face,gr:P.ground?1:0,g:P.gliding?1:0,h,a:+P.anim.toFixed(2),d:P.dashT>0?1:0,r:P.rollT>0?1:0});
}
function mpCaught(){
  sfx.meow();buzz([80,40,120]);shake=.5;netSend({t:'cg',o:NET.myId});
  toast('Caught! Back to the start of '+map.name,'#ffb27a');
  const keep=shards_got;startMap(mapIdx,NET.seed);countdown=1.2;shards_got=0;
}
function mpWon(){
  sfx.win();state='mpres';clearInput();
  const tm=Math.max(0,(performance.now()-NET.runStart)/1000),r={t:'fin',o:NET.myId,time:+tm.toFixed(2),ch:shards_got};
  netSend(r);handleGame(r);showMpResults();
}

resize();startMap(0);showMenu();checkInvite();requestAnimationFrame(frame);
if(/[?&]debug/.test(location.search))window.__nm={P,get cat(){return cat},get state(){return state},get obst(){return obst},get solids(){return solids},get boosts(){return boosts},get dpr(){return DPR},draw,play:(i)=>play(i,7),ui:{showMenu,showShop,showHow,showPause,showOver,showMp:s=>showMp(s),setEnd:v=>{ended=v}}};
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
})();
</script>
